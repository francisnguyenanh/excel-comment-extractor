<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Excel Comment Extractor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0fdf4 100%);
      transition: background .3s;
    }
    [data-bs-theme="dark"] body {
      background: linear-gradient(135deg, #1e1b4b 0%, #052e16 100%);
    }
    .login-card { width: 100%; max-width: 400px; padding: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">

    <!-- Theme toggle -->
    <div class="d-flex justify-content-end mb-2">
      <button id="themeToggle" class="btn btn-outline-secondary btn-sm">
        <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
      </button>
    </div>

    <div class="card shadow-lg border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="bi bi-file-earmark-spreadsheet text-primary" style="font-size:3rem"></i>
          <h4 class="fw-bold mt-2 mb-0">Excel Comment Extractor</h4>
          <p class="text-secondary small mt-1">Nhập mật khẩu để tiếp tục</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center py-2 mb-3">
          <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login">
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" id="password" name="password"
                     class="form-control form-control-lg"
                     placeholder="Nhập mật khẩu..."
                     autofocus required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const html = document.documentElement;
    const icon = document.getElementById('themeIcon');
    function applyTheme(t) {
      html.setAttribute('data-bs-theme', t);
      icon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
      localStorage.setItem('theme', t);
    }
    const saved = localStorage.getItem('theme');
    applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    document.getElementById('themeToggle').addEventListener('click', () => {
      applyTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
